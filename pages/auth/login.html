<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cheer Champ</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   
   <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Fredoka', sans-serif;
        background: linear-gradient(135deg, #fff5f7 0%, #ffe6f0 100%);
        min-height: 100vh;
        padding: 20px;
    }

    /* Header */
    .header {
        background: white;
        padding: 20px 5%;
        box-shadow: 0 2px 20px rgba(255, 110, 199, 0.1);
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .logo {
        font-size: 28px;
        font-weight: 700;
        background: linear-gradient(135deg, #ff6ec7 0%, #ffd93d 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-decoration: none;
    }

    .back-btn {
        padding: 12px 30px;
        background: linear-gradient(135deg, #ff6ec7 0%, #ffd93d 100%);
        color: white;
        border: none;
        border-radius: 50px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        transition: transform 0.3s;
    }

    .back-btn:hover {
        transform: scale(1.05);
    }

    /* Main Container */
    .auth-container {
        max-width: 900px;
        margin: 120px auto 50px;
        background: white;
        border-radius: 30px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(255, 110, 199, 0.2);
        display: flex;
        min-height: 600px;
    }

    /* Left Side - Decorative */
    .auth-left {
        flex: 1;
        background: linear-gradient(135deg, #ff6ec7 0%, #ffd93d 100%);
        padding: 60px 40px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        text-align: center;
    }

    .auth-left h2 {
        font-size: 36px;
        margin-bottom: 20px;
        font-weight: 700;
    }

    .auth-left p {
        font-size: 18px;
        line-height: 1.6;
        opacity: 0.95;
    }

    .auth-left i {
        font-size: 100px;
        margin-bottom: 30px;
        opacity: 0.9;
    }

    /* Right Side - Form */
    .auth-right {
        flex: 1;
        padding: 60px 50px;
    }

    .form-title {
        font-size: 32px;
        font-weight: 700;
        color: #ff6ec7;
        margin-bottom: 10px;
    }

    .form-subtitle {
        color: #666;
        margin-bottom: 30px;
        font-size: 14px;
    }

    .input-group {
        margin-bottom: 25px;
    }

    .input-group label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-weight: 600;
        font-size: 14px;
    }

    .input-wrapper {
        position: relative;
        display: block;
    }

    .input-wrapper i:first-child {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 18px;
        color: #ff6ec7;
        z-index: 2;
        pointer-events: none;
    }

    .input-wrapper .password-toggle {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        color: #ff6ec7;
        font-size: 20px;
        z-index: 10;
        pointer-events: auto;
    }

    .input-wrapper .form-input {
        width: 100%;
        padding: 15px 45px 15px 45px;
        border: 2px solid #ffe6f5;
        border-radius: 12px;
        font-size: 15px;
        font-family: 'Fredoka', sans-serif;
        transition: all 0.3s;
        position: relative;
        z-index: 1;
    }

    .input-wrapper .form-input:focus {
        outline: none;
        border-color: #ff6ec7;
        box-shadow: 0 0 0 3px rgba(255, 110, 199, 0.1);
    }

    .remember-forgot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
        font-size: 14px;
    }

    .remember-me {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .remember-me input[type="checkbox"] {
        width: 18px;
        height: 18px;
        cursor: pointer;
    }

    .forgot-link {
        color: #ff6ec7;
        text-decoration: none;
        font-weight: 600;
        cursor: pointer;
    }

    .forgot-link:hover {
        text-decoration: underline;
    }

    .submit-btn {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, #ff6ec7 0%, #ffd93d 100%);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.3s;
        font-family: 'Fredoka', sans-serif;
    }

    .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(255, 110, 199, 0.3);
    }

    .divider {
        text-align: center;
        margin: 25px 0;
        color: #999;
        font-size: 14px;
        position: relative;
    }

    .divider::before,
    .divider::after {
        content: '';
        position: absolute;
        top: 50%;
        width: 40%;
        height: 1px;
        background: #e0e0e0;
    }

    .divider::before { left: 0; }
    .divider::after { right: 0; }

    .social-login {
        display: flex;
        gap: 15px;
        margin-bottom: 25px;
    }

    .social-btn {
        flex: 1;
        padding: 12px;
        border: 2px solid #e0e0e0;
        border-radius: 12px;
        background: white;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: all 0.3s;
    }

    .social-btn:hover {
        border-color: #ff6ec7;
        transform: translateY(-2px);
    }

    .social-btn i {
        font-size: 18px;
    }

    .google-btn { color: #db4437; }
    .facebook-btn { color: #4267B2; }

    .switch-form {
        text-align: center;
        margin-top: 25px;
        font-size: 14px;
        color: #666;
    }

    .switch-link {
        color: #ff6ec7;
        font-weight: 700;
        text-decoration: none;
    }

    .switch-link:hover { 
        text-decoration: underline; 
    }

    /* Responsive */
    @media (max-width: 768px) {
        .auth-container {
            flex-direction: column;
            margin: 100px 20px 30px;
        }

        .auth-left {
            padding: 40px 30px;
        }

        .auth-left h2 { font-size: 28px; }
        .auth-left i { font-size: 70px; }

        .auth-right { padding: 40px 30px; }

        .form-title { font-size: 26px; }

        .social-login { flex-direction: column; }

        .header { padding: 15px 20px; }
        .logo { font-size: 22px; }
    }
</style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <a href="../../index.html" class="logo">✨ Cheer Champ</a>
        <a href="../../index.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
    </div>

    <!-- Main Container -->
    <div class="auth-container">
        <!-- Left Decorative Side -->
        <div class="auth-left">
            <i class="fas fa-shopping-bag"></i>
            <h2>Welcome Back!</h2>
            <p>Login to access your account and continue your cheerleading journey with exclusive deals! 🎉</p>
        </div>

        <!-- Right Form Side -->
        <div class="auth-right">
            <h2 class="form-title">Login 💖</h2>
            <p class="form-subtitle">Enter your detail to access your account</p>

            <form onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" class="form-input" id="loginEmail" placeholder="your@email.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" class="form-input" id="loginPassword" placeholder="••••••••" required>
                        <i class="fas fa-eye password-toggle" onclick="togglePassword('loginPassword')"></i>
                    </div>
                </div>

                <div class="remember-forgot">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>
                    <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
                </div>

                <button type="submit" class="submit-btn">Log In</button>
            </form>

            <div class="divider">or continue with</div>

            <div class="social-login">
                <button class="social-btn google-btn" onclick="socialLogin('Google')">
                    <i class="fab fa-google"></i>
                    Google
                </button>
                <button class="social-btn facebook-btn" onclick="socialLogin('Facebook')">
                    <i class="fab fa-facebook-f"></i>
                    Facebook
                </button>
            </div>

            <div class="switch-form">
                Don't have an account? 
                <a href="signup.html" class="switch-link">Sign Up</a>
            </div>
        </div>
    </div>

    <script>
    // Toggle Password Visibility
    function togglePassword(inputId) {
        const input = document.getElementById(inputId);
        const wrapper = input.parentElement;
        const icon = wrapper.querySelector('.password-toggle');
        
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }

    // Handle Login
    function handleLogin(event) {
        event.preventDefault();
        
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const rememberMe = document.getElementById('rememberMe').checked;
        
        // Basic validation
        if (!email || !password) {
            alert('❌ Please fill in all fields!');
            return false;
        }
        
        // Store remember me preference (in real app, use secure storage)
        if (rememberMe) {
            localStorage.setItem('rememberedEmail', email);
        }
        
        alert('🎉 Login Successful! Welcome back!');
        setTimeout(() => {
            window.location.href = '../../index.html';
        }, 1000);
        return false;
    }

    // Social Login - Coming Soon Message
    function socialLogin(provider) {
        alert(`🔗 ${provider} login is coming soon!\n\nWe're working on integrating ${provider} authentication to make your login experience even better. Stay tuned! 💖`);
    }

    // Load remembered email on page load
    window.addEventListener('load', function() {
        const rememberedEmail = localStorage.getItem('rememberedEmail');
        if (rememberedEmail) {
            document.getElementById('loginEmail').value = rememberedEmail;
            document.getElementById('rememberMe').checked = true;
        }
    });
    </script>
</body>
</html>
